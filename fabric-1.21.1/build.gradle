plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    // JourneyMap API (TeamJM 公式 maven)
    maven {
        name = "TeamJM"
        url = "https://jm.gserv.me/repository/maven-public/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "maven.modrinth:forge-config-api-port:${fcap_version}"

    // Ping-Wheel (compileOnly: jar に含めない)
    modCompileOnly "maven.modrinth:ping-wheel:${ping_wheel_version_id}"

    // Dev-only
    modRuntimeOnly "maven.modrinth:ping-wheel:${ping_wheel_version_id}"

    // FCAP の transitive: UnmodifiableConfig を compileOnly で公開 (FCAP v21.1.6 同梱版に合わせ 3.8.0)
    compileOnly "com.electronwill.night-config:core:3.8.0"
    // dev runtime に night-config 実体を供給 (FCAP の JiJ が dev で展開されないため。
    // 本番では FCAP mod が core/toml 3.8.0 を同梱するため公開 jar には影響なし)
    runtimeOnly "com.electronwill.night-config:core:3.8.0"
    runtimeOnly "com.electronwill.night-config:toml:3.8.0"

    // JourneyMap API: waypoint 登録用 (CLIENT のみ実体動作)。loom 1.14+ で remap 可。
    modCompileOnly("info.journeymap:journeymap-api-fabric:2.0.0-1.21.1-SNAPSHOT") {
        changing = true
    }

    // Dev-only: JourneyMap 本体 (runClient テスト用、公開 jar には含まれない)
    modRuntimeOnly "maven.modrinth:journeymap:${jm_version}"
    // JourneyMap Fabric の実行時依存 (Common Network by mysticdrew、dev runtime のみ)
    modRuntimeOnly "maven.modrinth:common-network:qJXqSlRN"
    // dev runtime に JM api 実体を供給 (Modrinth の JM jar は dev 解決で nested api を展開しない。
    // 本番では JM 本体が api を同梱するため、公開 jar は compileOnly のまま影響なし)
    modRuntimeOnly("info.journeymap:journeymap-api-fabric:2.0.0-1.21.1-SNAPSHOT") {
        changing = true
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version,
                "fabric_version": fabric_version,
                "mod_id": mod_id,
                "mod_name": mod_name,
                "mod_description": mod_description,
                "mod_authors": mod_authors,
                "mod_license": mod_license
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Mixin AP の strict mode 無効化 (外部 mod method の解決を skip)
loom {
    mixin {
        useLegacyMixinAp = false
    }
}

// LICENSE jar 同梱
// LICENSE は repo root にのみ置く (各 cell は独立 build なので相対参照する)
def licenseFile = file("../LICENSE")
jar {
    inputs.file(licenseFile)
    from(licenseFile) {
        rename { "${it}_${mod_id}" }
    }
}
